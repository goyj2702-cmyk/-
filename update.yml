name: Update data

# 매일 새벽 03:00 KST(= 18:00 UTC 전날)에 공고를 수집해 public/data.json을 갱신
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 쓰므로 pip install 단계가 없음
      - name: Crawl & merge
        run: python scripts/update_data.py

      - name: Validate JSON
        run: python -m json.tool public/data.json > /dev/null

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git commit -m "chore(data): daily update $(TZ=Asia/Seoul date +%F)"
          git push
